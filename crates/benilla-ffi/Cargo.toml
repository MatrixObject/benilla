[package]
name = "benilla-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI export layer for the UE5 render host: WoW 1.12.1 format readers (MPQ/ADT/M2/WMO/BLP) behind a cdylib."

[lib]
name = "benilla"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the standalone format readers; no Bevy, no app, no networking.
benilla-mpq = { path = "../benilla-mpq" }
benilla-adt = { path = "../benilla-adt" }
benilla-m2 = { path = "../benilla-m2" }
benilla-wmo = { path = "../benilla-wmo" }
benilla-blp = { path = "../benilla-blp" }
# Read-only use of the official adapters (adt_to_tile_mesh, load_wmo, Chain).
# default-features off: skip the `dev` feature (bakes source-tree paths).
benilla-formats = { path = "../benilla-formats", default-features = false }
# Stock WoW UI engine (FrameXML loader + Lua VM), read-only use for stage 3.
benilla-ui = { path = "../benilla-ui" }
# Glyph outlines for `bn_ui_text_bitmap` (FontString -> RGBA for the UE HUD).
ab_glyph = "0.2"

