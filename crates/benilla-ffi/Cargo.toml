[package]
name = "benilla-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI export layer for the UE5 render host: WoW 1.12.1 format readers (MPQ/ADT/M2/WMO/BLP) behind a cdylib."

[lib]
name = "benilla"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the standalone format readers; no Bevy, no app, no networking.
benilla-mpq = { path = "../benilla-mpq" }
benilla-adt = { path = "../benilla-adt" }
benilla-m2 = { path = "../benilla-m2" }
benilla-wmo = { path = "../benilla-wmo" }
benilla-blp = { path = "../benilla-blp" }
# Read-only use of the official adapters (adt_to_tile_mesh, load_wmo, Chain).
# default-features off: skip the `dev` feature (bakes source-tree paths).
benilla-formats = { path = "../benilla-formats", default-features = false }
# The one WMO portal cull the renderer runs (seed, flood, window frusta), Bevy-free.
benilla-cull = { path = "../benilla-cull" }
# The same glam benilla-cull is built on, so its matrices cross unchanged.
glam = "0.30"
# Stock WoW UI engine (FrameXML loader + Lua VM), read-only use for stage 3.
benilla-ui = { path = "../benilla-ui" }
# Wire protocol (SRP6 logon, realm list, world session) for the network
# middle layer. Protocol only: no Bevy, no app runtime.
benilla-protocol = { path = "../benilla-protocol" }
# Glyph outlines for `bn_ui_text_bitmap` (FontString -> RGBA for the UE HUD).
ab_glyph = "0.2"
# The client's audio: kira's mix with a cpal output written here (kira's own cpal
# backend wants cpal 0.18, which cannot share this lock with the workspace's 0.17).
# No Bevy, no app; the scheduler below is the app's rules over kira's primitives.
kira = { version = "0.12", default-features = false, features = [
    "mp3",
    "wav",
    "pcm",
    "adpcm",
] }
cpal = "0.17"

